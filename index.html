<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Frequência</title>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background: #f3f4f6;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin: 5px 0;
        }

        .evento {
            text-align: center;
            color: #666;
            margin-bottom: 15px;
        }

        .atividade {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 12px;
            background: #eeeeee;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        #resultado {
            margin-top: 15px;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            font-size: 17px;
            min-height: 70px;
        }

        .normal {
            background: #f3f4f6;
            color: #333;
        }

        .sucesso {
            background: #d4edda;
            color: #155724;
        }

        .aviso {
            background: #fff3cd;
            color: #856404;
        }

        .erro {
            background: #f8d7da;
            color: #721c24;
        }

        .contador {
            margin-top: 15px;
            text-align: center;
            font-size: 16px;
            color: #555;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Controle de Frequência</h1>

        <div class="evento">
            VIII Semana de Aquicultura
        </div>

        <div id="atividade" class="atividade">
            Carregando atividade...
        </div>

        <div id="reader"></div>

        <div id="resultado" class="normal">
            Aponte a câmera para o QR Code do participante.
        </div>

        <div id="contador" class="contador">
            Presenças nesta sessão: 0
        </div>

    </div>


    <script>

        let ultimoEstado = "";

        function atualizarPainel(dados) {

            const estado = JSON.stringify(dados);

            // Não redesenha a tela se nada mudou
            if (estado === ultimoEstado) {
                return;
            }

            ultimoEstado = estado;

            const status =
                document.getElementById("status");

            const nome =
                document.getElementById("nome");

            const id =
                document.getElementById("id");

            const atividade =
                document.getElementById("atividade");

            const horario =
                document.getElementById("horario");


            nome.innerText =
                dados.nome || "";

            id.innerText =
                dados.id || "";

            atividade.innerText =
                dados.atividade || "";

            horario.innerText =
                dados.dataHora || "";


            if (dados.status === "SUCESSO") {

                status.innerText =
                    "✓ PRESENÇA REGISTRADA";

                status.className =
                    "status sucesso";

            }

            else if (dados.status === "DUPLICADO") {

                status.innerText =
                    "⚠ PRESENÇA JÁ REGISTRADA";

                status.className =
                    "status duplicado";

            }

            else if (dados.status === "ERRO") {

                status.innerText =
                    "✕ QR CODE INVÁLIDO";

                status.className =
                    "status erro";

            }

            else {

                status.innerText =
                    "AGUARDANDO PARTICIPANTE";

                status.className =
                    "status aguardando";

            }

        }


        function consultarPainel() {

            google.script.run

                .withSuccessHandler(function (dados) {

                    console.log(
                        "Painel recebido:",
                        dados
                    );

                    atualizarPainel(dados);

                })

                .withFailureHandler(function (erro) {

                    console.error(
                        "Erro ao consultar painel:",
                        erro
                    );

                })

                .obterPainel();

        }


        consultarPainel();

        setInterval(
            consultarPainel,
            1000
        );

    </script>

</body>

</html>
