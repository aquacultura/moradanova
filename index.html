<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Controle de Frequência</title>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background: #f3f4f6;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin: 5px 0;
        }

        .evento {
            text-align: center;
            color: #666;
            margin-bottom: 15px;
        }

        .atividade {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding: 12px;
            background: #eeeeee;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: auto;
        }

        #resultado {
            margin-top: 15px;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            font-size: 17px;
            min-height: 70px;
        }

        .normal {
            background: #f3f4f6;
            color: #333;
        }

        .sucesso {
            background: #d4edda;
            color: #155724;
        }

        .aviso {
            background: #fff3cd;
            color: #856404;
        }

        .erro {
            background: #f8d7da;
            color: #721c24;
        }

        .contador {
            margin-top: 15px;
            text-align: center;
            font-size: 16px;
            color: #555;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>Controle de Frequência</h1>

        <div class="evento">
            VIII Semana de Aquicultura
        </div>

        <div id="atividade" class="atividade">
            Atividade atual
        </div>

        <div id="reader"></div>

        <div id="resultado" class="normal">
            Aponte a câmera para o QR Code do participante.
        </div>

        <div id="contador" class="contador">
            Presenças enviadas nesta sessão: 0
        </div>

    </div>


    <script>

        let scanner = null;

        let processando = false;

        let totalPresencas = 0;


        // =====================================================
        // MOSTRAR RESULTADO
        // =====================================================

        function mostrarResultado(
            mensagem,
            classe = "normal"
        ) {

            const elemento =
                document.getElementById("resultado");

            elemento.innerHTML = mensagem;

            elemento.className = classe;

        }


        // =====================================================
        // CONTADOR
        // =====================================================

        function atualizarContador() {

            document.getElementById("contador")
                .innerText =
                "Presenças enviadas nesta sessão: " +
                totalPresencas;

        }


        // =====================================================
        // PROCESSAR QR CODE
        // =====================================================

        async function processarQRCode(decodedText) {

            if (processando) {
                return;
            }

            processando = true;


            try {

                await scanner.pause(true);

            } catch (erro) {

                console.log("Scanner já pausado.");

            }


            mostrarResultado(
                "QR Code identificado.<br>" +
                "Registrando presença...",
                "normal"
            );


            try {

                const url =
                    new URL(decodedText);

                const token =
                    url.searchParams.get("t");


                if (!token) {

                    mostrarResultado(
                        "<strong>QR Code inválido.</strong><br>" +
                        "Token não encontrado.",
                        "erro"
                    );

                    finalizarLeitura();

                    return;
                }


                // Informa ao Apps Script que deve registrar

                url.searchParams.set(
                    "registrar",
                    "1"
                );


                /*
                 * Envio silencioso.
                 *
                 * O navegador permanece no GitHub Pages.
                 */

                await fetch(
                    url.toString(),
                    {
                        method: "GET",
                        mode: "no-cors",
                        redirect: "follow"
                    }
                );


                totalPresencas++;

                atualizarContador();


                mostrarResultado(
                    "<strong>✓ PRESENÇA ENVIADA</strong><br><br>" +
                    "Aguarde a confirmação no monitor.",
                    "sucesso"
                );


            } catch (erro) {

                console.error(erro);

                mostrarResultado(
                    "<strong>Erro ao enviar registro.</strong><br>" +
                    "Verifique a conexão.",
                    "erro"
                );

            }


            setTimeout(
                finalizarLeitura,
                2000
            );

        }


        // =====================================================
        // VOLTAR AO SCANNER
        // =====================================================

        async function finalizarLeitura() {

            processando = false;


            mostrarResultado(
                "Aponte a câmera para o próximo participante.",
                "normal"
            );


            try {

                await scanner.resume();

            } catch (erro) {

                console.error(
                    "Erro ao retomar scanner:",
                    erro
                );

            }

        }


        // =====================================================
        // INICIAR CÂMERA
        // =====================================================

        function iniciarScanner() {

            scanner =
                new Html5Qrcode("reader");


            scanner.start(

                {
                    facingMode: "environment"
                },

                {
                    fps: 10,

                    qrbox: {
                        width: 250,
                        height: 250
                    }
                },

                processarQRCode,

                function (errorMessage) {

                    // Erros normais de leitura são ignorados.

                }

            ).catch(function (erro) {

                console.error(erro);

                mostrarResultado(
                    "<strong>Não foi possível iniciar a câmera.</strong><br>" +
                    "Verifique a permissão da câmera.",
                    "erro"
                );

            });

        }


        // =====================================================
        // INICIALIZAÇÃO
        // =====================================================

        window.addEventListener(
            "load",
            iniciarScanner
        );

    </script>

</body>

</html>
